# Cabeceras de seguridad para lo que Nginx sirve del disco (el frontend).
#
# Se instala en /etc/nginx/snippets/mudar-cabeceras.conf y se incluye con
# `include` dentro de CADA location que sirve archivos: /assets/, /index.html
# y /. No va a nivel de server porque add_header se hereda solo si el location
# no declara ninguno propio, y /assets/ e /index.html declaran Cache-Control:
# puestas arriba, justo la página de acceso saldría sin ellas.
#
# Lo que va a Django (/api/, /static/, /gestion/) NO lo incluye: esas
# respuestas ya traen las mismas cabeceras desde SecurityMiddleware y
# XFrameOptionsMiddleware, y repetirlas aquí las enviaría duplicadas.
#
# `always` las añade también a las respuestas de error (404, 500...); sin él,
# Nginx solo las pone en las correctas.

# Obliga al navegador a volver siempre por HTTPS durante ese plazo.
# ⚠️ T15: mismo valor que SECURE_HSTS_SECONDS en settings.py. Se suben JUNTOS
#    a un año en el bloque D, con el certificado ya estable.
add_header Strict-Transport-Security "max-age=3600" always;

# Ninguna otra web puede cargar la aplicación dentro de un marco.
add_header X-Frame-Options "DENY" always;

# El navegador no adivina el tipo de un archivo: usa el declarado.
add_header X-Content-Type-Options "nosniff" always;
