# Jail de fail2ban para los inicios de sesión fallidos de MUDAR.
#
# Se instala en /etc/fail2ban/jail.d/mudar.conf, después del filtro
# (fail2ban-filtro.conf -> /etc/fail2ban/filter.d/mudar-login.conf), y se
# activa con: sudo fail2ban-client reload

[mudar-login]
enabled  = true
filter   = mudar-login

# ⚠️ Declarado a mano. Ubuntu trae backend = systemd en
#    jail.d/defaults-debian.conf para TODAS las jails: con él, fail2ban lee el
#    diario del sistema, ignora logpath y no detecta nada, sin dar ningún error.
#    polling revisa el archivo cada segundo y sigue la rotación del registro.
backend  = polling
logpath  = /var/log/mudar/seguridad.log

# Solo se corta al infractor en la web, no en toda la máquina.
port     = http,https

# 10 fallos en 10 minutos -> 1 hora de bloqueo. Holgado a propósito: parte de
# los usuarios tiene poca soltura con la tecnología. Se complementa con el
# límite de Nginx en el login (10 peticiones por minuto): Nginx frena la
# ráfaga y fail2ban corta a quien insiste.
maxretry = 10
findtime = 10m
bantime  = 1h

# IPs que nunca se bloquean: la propia máquina.
# ⚠️ En GTD se añade la IP pública de la planta, por la que salen TODOS sus
#    equipos: sin ella, diez errores de operarios distintos bloquearían la
#    planta entera. Se escribe solo en el archivo del servidor, nunca aquí:
#    este repositorio es público.
#      ignoreip = 127.0.0.1/8 ::1 <IP_PUBLICA_PLANTA>
ignoreip = 127.0.0.1/8 ::1
