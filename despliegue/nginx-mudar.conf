# Sitio de MUDAR para Nginx.
#
# Se instala copiándolo a /etc/nginx/sites-available/mudar y activándolo con un
# enlace simbólico en /etc/nginx/sites-enabled/. Después, siempre en este orden:
#     sudo nginx -t && sudo systemctl reload nginx
# El -t valida sin tocar el servicio; si falla, el reload no llega a ejecutarse
# y Nginx sigue sirviendo la configuración anterior.
#
# ⚠️ ESTA ES LA VERSIÓN DEL ENSAYO. Antes de GTD cambian dos cosas:
#      - server_name          -> app.mudarcolombia.com
#      - ssl_certificate      -> los que emita certbot en /etc/letsencrypt/
#    El resto viaja idéntico, incluido el prefijo /gestion/ del panel.
#
# ⚠️ ESTADO: subpaso 10.9. Configuración completa del paso 10.
#    Requisito: el directorio /var/www/certbot debe existir.


# ── Límite de peticiones al login ────────────────────────────────────────────
# Va aquí arriba, fuera de los server, porque limit_req_zone pertenece al
# contexto http: este archivo se incluye DENTRO de http, así que esta posición
# es la correcta.
#
#   $binary_remote_addr -> indexa por IP de origen, en su forma binaria, que
#                          ocupa 4 bytes en vez de los 15 del texto.
#   zone=login:10m      -> 10 MEGABYTES de memoria compartida, no 10 minutos.
#                          Dan para unas 160.000 IPs simultáneas.
#   rate=10r/m          -> diez peticiones por minuto y por IP.
#
# ⚠️ El número es GENEROSO a propósito, y el motivo no es obvio: en la planta
#    todos los equipos salen por una sola IP pública, así que comparten cubo, y
#    un cambio de turno son cinco ingresos casi simultáneos. Además, si Nginx
#    rechazara aquí, la petición NO llegaría a Django, no se escribiría la línea
#    en seguridad.log y fail2ban —que solo mira ese archivo— no vería nada.
#    Apretar este cerrojo ciega al que de verdad distingue un intento fallido de
#    uno bueno. Reparto: limit_req generoso, fail2ban estricto.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;


# ── Puerto 80 ────────────────────────────────────────────────────────────────
# Sirve UNA sola cosa —el desafío de Let's Encrypt— y redirige todo lo demás a
# la versión cifrada.
server {
    listen 80;
    server_name app.mudar.test;

    # ── Excepción para Let's Encrypt (T3) ────────────────────────────────────
    # El desafío HTTP-01 entra SIEMPRE por el puerto 80 y en claro. Si el 301 de
    # abajo se lo tragara, certbot no podría validar el dominio.
    #
    # ⚠️ No es solo para el día de la emisión: el certificado dura 90 días y la
    #    renovación usa este mismo camino. Si esto queda mal, funciona tres meses
    #    y después el certificado vence de madrugada, sin aviso útil, y con el
    #    HSTS impidiendo entrar en claro a mirar qué pasó.
    #
    # El `^~` significa «si el prefijo casa, no sigas buscando». Con solo estos
    # dos location bastaría el prefijo más largo, pero lo deja explícito y
    # protege de una regla con expresión regular que alguien añada mañana.
    #
    # default_type text/plain porque el archivo del desafío no tiene extensión y
    # Nginx lo serviría como descarga binaria.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Todo lo demás, a la versión cifrada. $request_uri conserva la ruta y los
    # parámetros, así que no se pierde a dónde iba el usuario.
    location / {
        return 301 https://$host$request_uri;
    }
}


# ── Puerto 443 ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.mudar.test;

    # El certificado es público y la clave es secreta: por eso viven en
    # directorios con permisos distintos.
    ssl_certificate     /etc/ssl/certs/mudar-ensayo.crt;
    ssl_certificate_key /etc/ssl/private/mudar-ensayo.key;

    # Dónde está el frontend compilado. Lo sirve Nginx directamente del disco,
    # sin molestar a Gunicorn.
    root /var/www/mudar;

    # Cabeceras del proxy, declaradas UNA sola vez a nivel de server. Todos los
    # location de abajo las heredan, de modo que no pueden divergir entre sí.
    #
    #   Host                -> sin ella Django recibiría 127.0.0.1:8000 y
    #                          respondería 400 DisallowedHost.
    #   X-Forwarded-For     -> $remote_addr y NO $proxy_add_x_forwarded_for:
    #                          obtener_ip() toma la primera de la lista, así que
    #                          la segunda forma dejaría falsificar la IP.
    #   X-Forwarded-Proto   -> sin ella Django cree que la conexión vino en
    #                          claro y responde 301 en bucle.
    #
    # ⚠️ Si algún location declarara su propio proxy_set_header, perdería TODAS
    #    las heredadas, no solo la que repita. Es la regla de herencia de Nginx.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Mayor que el --timeout 30 de Gunicorn. Si fuera menor, un proceso lento
    # daría un 502 de Nginx en vez del error real de la aplicación.
    proxy_read_timeout 35s;


    # ── Lo que va a Django ───────────────────────────────────────────────────
    # Nginx elige el location por el prefijo MÁS LARGO que case, no por el orden
    # en que estén escritos aquí.

    # El login, con límite de peticiones. El `=` es coincidencia EXACTA y tiene
    # prioridad absoluta sobre cualquier prefijo, así que solo se limita esta
    # ruta y no el resto de /api/auth/.
    #
    #   burst=10 nodelay -> admite una ráfaga de 10 de golpe sin retenerlas, y
    #                       a partir de ahí aplica el ritmo de 10 por minuto.
    #   limit_req_status -> 429 «demasiadas peticiones». El valor por omisión de
    #                       Nginx es 503, que MIENTE: dice «servidor no
    #                       disponible» y tanto una persona como un monitor lo
    #                       leerían como una caída.
    location = /api/auth/login/ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
    }

    # El resto de la API: las 40 rutas que consume el frontend.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Estáticos del panel y de DRF. Los sirve WhiteNoise desde dentro de
    # Gunicorn, leyendo /opt/mudar/staticfiles.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # El panel de administración. Nginx solo conoce el PREFIJO; la ruta completa
    # vive en ADMIN_URL, dentro de /etc/mudar/env, y no sale de ahí. Así el valor
    # no adivinable de producción no tiene que escribirse también aquí.
    location /gestion/ {
        proxy_pass http://127.0.0.1:8000;
    }


    # ── Lo que sirve Nginx del disco ─────────────────────────────────────────

    # Los archivos de assets/ llevan una huella del contenido en el nombre, así
    # que su URL cambia siempre que cambia el código. Eso los hace cacheables
    # para siempre sin riesgo de servir algo viejo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html es la excepción: es el ÚNICO nombre fijo del paquete. Si el
    # navegador se quedara con una copia vieja, seguiría pidiendo los assets
    # anteriores aunque el despliegue ya hubiera cambiado. Se revalida siempre.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El frontend. try_files busca el archivo pedido, luego un directorio con
    # ese nombre, y si no existe ninguno devuelve index.html.
    #
    # Esa última parte es lo que hace funcionar una SPA: rutas como /doms/57 no
    # existen en el disco, pero el navegador debe recibir index.html igualmente
    # para que React Router lea la dirección y pinte la pantalla correcta. Sin
    # esta línea, entrar por URL directa o pulsar F5 daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
