# Filtro de fail2ban para los inicios de sesión fallidos de MUDAR.
#
# Se instala en /etc/fail2ban/filter.d/mudar-login.conf. Lo usa la jaula
# mudar-login (fail2ban-jaula.conf), que vigila /var/log/mudar/seguridad.log.
#
# La línea que reconoce la escribe LoginView (server/views.py):
#   2026-09-24 03:44:59,620 WARNING server.seguridad Login fallido usuario=prueba ip=127.0.0.1
# El formato es un contrato entre los dos archivos: si cambia allí, hay que
# cambiarlo aquí, o fail2ban dejará de ver los intentos sin dar ningún error.

[Definition]

# fail2ban reconoce la fecha con datepattern, la RECORTA de la línea y aplica
# esta expresión a lo que queda; por eso empieza por ^\s*.
#
#   server\.seguridad -> punto literal; sin la barra, «cualquier carácter».
#   usuario=.*        -> el usuario lo escribe quien intenta entrar. El .* es
#                        voraz, así que la IP que se toma es la ÚLTIMA ip= de
#                        la línea: la que alguien meta dentro del usuario no
#                        cuenta.
#   <HOST>            -> la IP que fail2ban apunta y, llegado el caso, bloquea.
failregex = ^\s*WARNING server\.seguridad Login fallido usuario=.* ip=<HOST>$

ignoreregex =

# La fecha de Python lleva coma antes de los milisegundos. Si no se reconoce,
# fail2ban descarta la línea en silencio (T11). El % va duplicado porque en
# estos archivos un % solo introduce una referencia a otra variable.
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S,%%f
